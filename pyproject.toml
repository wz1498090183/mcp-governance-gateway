[project]
name = "mcp-gateway"
version = "0.1.0"
description = "MCP 治理网关（阶段二：JWT 鉴权与工具级权限）"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141,<1",
    "uvicorn>=0.52,<1",
    "mcp==2.0.0",
    "pyyaml>=6.0,<7",
    "pydantic>=2.13,<3",
    "pyjwt>=2.13,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "httpx>=0.28,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
